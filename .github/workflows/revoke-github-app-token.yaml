# Reusable workflow: revoke a GitHub App token generated by the
# generate-github-app-token workflow. No inputs.
#
# See generate-github-app-token.yaml for the usage.
#
# Secret:
#   token: the GitHub App token to revoke, decoded with `fromJSON()` (required).
#          It is received as a secret so that it is masked in the logs.

name: Revoke GitHub App token

on:
  workflow_call:
    secrets:
      token:
        required: true

permissions: {}

jobs:
  revoke-github-app-token:
    name: Revoke GitHub App token
    runs-on: ubuntu-latest
    steps:
      - name: Revoke GitHub App token
        env:
          GH_TOKEN: ${{ secrets.token }}
        run: gh api --method DELETE /installation/token
