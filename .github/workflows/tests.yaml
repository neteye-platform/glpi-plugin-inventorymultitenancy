name: Continuous integration

on:
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  generate-ci-matrix:
    name: Generate CI matrix
    uses: glpi-project/plugin-ci-workflows/.github/workflows/generate-ci-matrix.yml@9a061563713f902c3ad529f8d6f935c6a3247e37 # v1.30.3
    with:
      glpi-version: "11.0.x"
  ci:
    name: "GLPI ${{ matrix.glpi-version }} - php:${{ matrix.php-version }} - ${{ matrix.db-image }}"
    needs: generate-ci-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-ci-matrix.outputs.matrix) }}
    # TODO: Use the official GLPI action when they pin all the action SHA
    uses: ./.github/workflows/continuous-integration.yaml
    with:
      plugin-key: inventorymultitenancy
      glpi-version: ${{ matrix.glpi-version }}
      php-version: ${{ matrix.php-version }}
      db-image: ${{ matrix.db-image }}
